  color: white;
  text-align: center;
}
header {
  padding: 35px 15px;
  background: radial-gradient(circle, #123b75, #050914 70%);
  border-bottom: 2px solid #00bfff;
}
.dragon {
  font-size: 65px;

.apps {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));

}
.app {
  background: #0d1729;
  border: 1px solid #087bcb;
  border-radius: 16px;
  padding: 25px 15px;
  box-shadow: 0 0 15px #00345b;
}
.app-icon {
  font-size: 55px;
}
.app h2 {
  color: #70dfff;
}
.app p {
  color: #c0cbd9;
}
.download {
  display: inline-block;
  background: #00bfff;
  color: #00101d;
  font-weight: bold;
  padding: 12px 25px;
  border-radius: 8px;
  text-decoration: none;
  margin-top: 10px;
}
.download:hover {
  background: white;
  box-shadow: 0 0 15px #00bfff;
}
footer {
  padding: 25px;
  color: #8196ad;
}
</style>
</head>
